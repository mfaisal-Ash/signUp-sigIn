<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up & Sign In</title>
    <link rel="icon" href="data:,">

    <!-- Content-Security-Policy: batasi sumber script/style/koneksi hanya ke file sendiri,
         supaya XSS lebih sulit dan situs tidak bergantung pada domain luar. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';">

    <!-- Asset di-self-host (bukan CDN pihak ketiga) supaya situs tetap jalan
         walau CDN eksternal sedang down / diblokir / kena serangan. -->
    <link rel="stylesheet" href="./css/tailwind.min.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">
    <script src="./javascript/vendor/sweetalert2.min.js"></script>
</head>
<body class="bg-gray-200">

    <div class="w-full max-w-md mx-auto mt-10 mb-16 bg-white rounded-lg shadow">

        <!-- Tabs -->
        <ul id="tabs" class="flex w-full px-1 pt-2 border-b border-gray-200">
          <li class="px-4 py-2 font-semibold text-gray-800 rounded-t opacity-50"><a href="#second">Sign Up</a></li>
          <li class="px-4 py-2 font-semibold text-gray-800 rounded-t opacity-50"><a href="#third">Sign In</a></li>
        </ul>

        <!-- Tab Contents -->
        <div id="tab-contents">

          <!-- ============ SIGN UP ============ -->
          <div id="second" class="hidden p-6">
            <h2 class="mb-4 text-lg font-bold text-[#07074D]">Registration</h2>

            <form id="form-signup" novalidate>
              <!-- Honeypot anti-bot: field ini disembunyikan dari manusia lewat CSS.
                   Bot yang asal isi semua field otomatis akan mengisi ini -> submit ditolak. -->
              <div class="absolute -left-[9999px]" aria-hidden="true">
                <label for="website">Website</label>
                <input type="text" name="website" id="website" tabindex="-1" autocomplete="off" />
              </div>

              <div class="mb-5">
                <label for="first_name" class="mb-2 block text-sm font-medium text-[#07074D]">First Name</label>
                <input type="text" name="first_name" id="first_name" placeholder="First Name" maxlength="50"
                  class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
              </div>

              <div class="mb-5">
                <label for="last_name" class="mb-2 block text-sm font-medium text-[#07074D]">Last Name</label>
                <input type="text" name="last_name" id="last_name" placeholder="Last Name" maxlength="50"
                  class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
              </div>

              <div class="mb-5">
                <label for="nickname" class="mb-2 block text-sm font-medium text-[#07074D]">Nickname</label>
                <input type="text" name="nickname" id="nickname" placeholder="Masukkan Nickname Anda" maxlength="30"
                  class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
              </div>

              <div class="mb-5">
                <label for="email" class="mb-2 block text-sm font-medium text-[#07074D]">Email</label>
                <input type="email" name="email" id="email" placeholder="faisal@gmail.com" maxlength="100"
                  class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
              </div>

              <div class="mb-5">
                <label for="password" class="mb-2 block text-sm font-medium text-[#07074D]">Password</label>
                <div class="flex gap-2">
                  <input type="password" name="password" id="password" placeholder="Masukkan Password Anda" maxlength="72"
                    class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
                  <button type="button" data-target="password"
                    class="toggle-password shrink-0 rounded-md border border-[#e0e0e0] px-3 text-xs font-medium text-[#6A64F1]">Tampilkan</button>
                </div>
                <p class="mt-1 text-xs text-gray-400">Min. 8 karakter, kombinasi huruf besar, huruf kecil & angka.</p>
              </div>

              <div class="mb-5">
                <label for="confirm_password" class="mb-2 block text-sm font-medium text-[#07074D]">Confirm Password</label>
                <div class="flex gap-2">
                  <input type="password" name="confirm_password" id="confirm_password" placeholder="Ulangi Password Anda" maxlength="72"
                    class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
                  <button type="button" data-target="confirm_password"
                    class="toggle-password shrink-0 rounded-md border border-[#e0e0e0] px-3 text-xs font-medium text-[#6A64F1]">Tampilkan</button>
                </div>
              </div>

              <button type="submit"
                class="w-full rounded-md bg-[#6A64F1] py-3 px-6 text-base font-semibold text-white hover:bg-[#554fd8]">
                Sign Up
              </button>
            </form>
          </div>

          <!-- ============ SIGN IN ============ -->
          <div id="third" class="hidden p-6">
            <h2 class="mb-4 text-lg font-bold text-[#07074D]">Login</h2>

            <form id="form-signin" novalidate>
              <!-- Honeypot anti-bot -->
              <div class="absolute -left-[9999px]" aria-hidden="true">
                <label for="login_website">Website</label>
                <input type="text" name="website" id="login_website" tabindex="-1" autocomplete="off" />
              </div>

              <div class="mb-5">
                <label for="login_nickname" class="mb-2 block text-sm font-medium text-[#07074D]">Nickname</label>
                <input type="text" name="nickname" id="login_nickname" placeholder="Masukkan Nickname Anda" maxlength="30"
                  class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
              </div>

              <div class="mb-5">
                <label for="login_password" class="mb-2 block text-sm font-medium text-[#07074D]">Password</label>
                <div class="flex gap-2">
                  <input type="password" name="password" id="login_password" placeholder="Masukkan Password Anda" maxlength="72"
                    class="w-full rounded-md border border-[#e0e0e0] bg-white py-3 px-4 text-base text-[#6B7280] outline-none focus:border-[#6A64F1] focus:shadow-md" />
                  <button type="button" data-target="login_password"
                    class="toggle-password shrink-0 rounded-md border border-[#e0e0e0] px-3 text-xs font-medium text-[#6A64F1]">Tampilkan</button>
                </div>
                <p id="signin-lockout-msg" class="mt-1 hidden text-xs text-red-500"></p>
              </div>

              <button type="submit"
                class="w-full rounded-md bg-green-600 py-3 px-6 text-base font-semibold text-white hover:bg-green-700">
                Sign In
              </button>
            </form>
          </div>

        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 z-40 px-4 py-3 text-center text-white bg-gray-800">
        GITHUB.
        <a class="text-gray-200 underline" href="https://github.com/Muhammad-Faisal-Ashshidiq/">Link</a>
    </div>

    <script src="./javascript/tabs.js"></script>
    <script src="./javascript/auth.js"></script>
</body>
</html>
